<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeForge — Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=Roboto:wght@300;400;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0f0f0f;--paper:#faf8f4;--cream:#f0ece3;--gold:#c9a84c;--slate:#4a4a5a;--muted:#9a9aaa;--sidebar-w:400px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:#f4f4f4;color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column;}

  /* TOP BAR */
  .editor-top{
    background:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid #e8e8e8;z-index:100;flex-shrink:0;
  }
  .editor-top-left{display:flex;align-items:center;gap:16px;}
  .back-link{color:var(--muted);text-decoration:none;font-size:13px;display:flex;align-items:center;gap:5px;}
  .back-link:hover{color:var(--ink);}
  .editor-title{font-family:'Playfair Display',serif;font-size:18px;}
  .tpl-badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:var(--cream);color:var(--slate);}
  .editor-actions{display:flex;gap:10px;align-items:center;}
  .color-group{display:flex;gap:6px;align-items:center;margin-right:6px;}
  .color-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.2s;}
  .color-dot.active,.color-dot:hover{border-color:var(--ink);transform:scale(1.2);}
  .btn{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all 0.2s;}
  .btn-ghost{background:transparent;border:1.5px solid #ddd;color:var(--slate);}
  .btn-ghost:hover{border-color:var(--ink);color:var(--ink);}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:var(--gold);color:var(--ink);}
  .btn-dl{background:var(--gold);color:var(--ink);}
  .btn-dl:hover{background:#b8960a;color:#fff;}

  /* LAYOUT */
  .editor-body{display:flex;flex:1;overflow:hidden;}

  /* LEFT PANEL */
  .left-panel{width:var(--sidebar-w);background:#fff;border-right:1px solid #e8e8e8;overflow-y:auto;flex-shrink:0;}
  .left-panel::-webkit-scrollbar{width:4px;}
  .left-panel::-webkit-scrollbar-track{background:#f4f4f4;}
  .left-panel::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px;}

  .form-section{border-bottom:1px solid #f0f0f0;}
  .section-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;cursor:pointer;user-select:none;
  }
  .section-header h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .section-icon{font-size:16px;}
  .chevron{font-size:12px;transition:transform 0.2s;}
  .section-body{padding:0 20px 20px;display:none;}
  .section-body.open{display:block;}

  .form-group{margin-bottom:14px;}
  .form-label{font-size:12px;font-weight:600;color:var(--slate);margin-bottom:5px;display:block;letter-spacing:0.3px;}
  .form-input,.form-textarea{
    width:100%;padding:10px 13px;border:1.5px solid #e8e8e8;border-radius:8px;
    font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);
    outline:none;transition:all 0.2s;background:#fafafa;
  }
  .form-input:focus,.form-textarea:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(201,168,76,0.12);}
  .form-textarea{resize:vertical;min-height:80px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* Dynamic entries */
  .entry-card{background:#f8f8f8;border-radius:10px;padding:14px;margin-bottom:12px;position:relative;border:1px solid #eee;}
  .entry-remove{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;}
  .entry-remove:hover{color:#e53935;}
  .add-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    width:100%;padding:9px;border:1.5px dashed #ccc;border-radius:8px;
    background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;
    transition:all 0.2s;
  }
  .add-btn:hover{border-color:var(--gold);color:var(--gold);}

  /* Skills chips */
  .skills-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .skill-chip{
    display:inline-flex;align-items:center;gap:5px;padding:4px 10px;
    background:var(--ink);color:#fff;border-radius:20px;font-size:12px;
  }
  .chip-remove{cursor:pointer;opacity:0.6;line-height:1;}
  .chip-remove:hover{opacity:1;}

  /* RIGHT PANEL */
  .right-panel{flex:1;overflow:auto;background:#e8e8e8;display:flex;align-items:flex-start;justify-content:center;padding:30px;}
  .resume-paper{
    width:794px;min-height:1123px;background:#fff;
    box-shadow:0 8px 40px rgba(0,0,0,0.18);flex-shrink:0;
    position:relative;
  }

  /* =================== TEMPLATE STYLES =================== */

  /* CLASSIC */
  #tpl-classic .c-header{padding:28px 40px;color:#fff;}
  #tpl-classic .c-name{font-size:28px;font-weight:700;letter-spacing:-0.5px;}
  #tpl-classic .c-title{font-size:14px;opacity:0.85;margin-top:4px;}
  #tpl-classic .c-contact{font-size:12px;opacity:0.75;margin-top:6px;}
  #tpl-classic .c-body{display:flex;gap:0;padding:24px 40px;}
  #tpl-classic .c-main{flex:1;}
  #tpl-classic .c-sidebar{width:200px;margin-left:28px;}
  #tpl-classic .c-section-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;margin-top:18px;padding-bottom:4px;border-bottom:2px solid currentColor;}
  #tpl-classic .c-section-title:first-child{margin-top:0;}
  #tpl-classic .c-job-title{font-weight:600;font-size:14px;margin-bottom:2px;}
  #tpl-classic .c-job-org{font-size:13px;color:#666;margin-bottom:2px;}
  #tpl-classic .c-job-date{font-size:11px;color:#888;margin-bottom:5px;}
  #tpl-classic .c-bullet{font-size:13px;color:#444;line-height:1.5;padding-left:14px;position:relative;}
  #tpl-classic .c-bullet::before{content:'•';position:absolute;left:0;}
  #tpl-classic .c-skill{font-size:12px;padding:3px 0;color:#444;border-bottom:1px solid #f0f0f0;}
  #tpl-classic .c-para{font-size:13px;color:#444;line-height:1.6;}
  #tpl-classic .c-edu{margin-bottom:10px;}
  #tpl-classic .c-edu-deg{font-weight:600;font-size:13px;}
  #tpl-classic .c-edu-school{font-size:12px;color:#666;}
  #tpl-classic .c-edu-year{font-size:11px;color:#888;}

  /* SIDEBAR */
  #tpl-sidebar{display:flex;min-height:1123px;}
  #tpl-sidebar .s-left{width:260px;min-height:100%;padding:32px 22px;color:#fff;flex-shrink:0;}
  #tpl-sidebar .s-avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 16px;background:rgba(255,255,255,0.2);}
  #tpl-sidebar .s-name{font-size:20px;font-weight:700;text-align:center;margin-bottom:4px;}
  #tpl-sidebar .s-role{font-size:12px;text-align:center;opacity:0.75;margin-bottom:20px;}
  #tpl-sidebar .s-section{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:16px 0 8px;opacity:0.7;}
  #tpl-sidebar .s-info{font-size:12px;margin-bottom:5px;opacity:0.85;word-break:break-word;}
  #tpl-sidebar .s-skill-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  #tpl-sidebar .s-skill-label{font-size:11px;width:80px;flex-shrink:0;}
  #tpl-sidebar .s-skill-bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.25);}
  #tpl-sidebar .s-skill-fill{height:100%;border-radius:2px;background:rgba(255,255,255,0.85);}
  #tpl-sidebar .s-right{flex:1;padding:32px 28px;}
  #tpl-sidebar .s-right-name{font-size:32px;font-weight:700;letter-spacing:-1px;margin-bottom:4px;}
  #tpl-sidebar .s-right-title{font-size:14px;color:#666;margin-bottom:20px;}
  #tpl-sidebar .s-r-section{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid;}
  #tpl-sidebar .s-r-section:first-child{margin-top:0;}
  #tpl-sidebar .r-job-title{font-weight:600;font-size:13px;}
  #tpl-sidebar .r-job-org{font-size:12px;color:#666;}
  #tpl-sidebar .r-job-date{font-size:11px;color:#888;margin-bottom:4px;}
  #tpl-sidebar .r-bullet{font-size:12px;color:#444;line-height:1.5;padding-left:12px;position:relative;}
  #tpl-sidebar .r-bullet::before{content:'▸';position:absolute;left:0;}
  #tpl-sidebar .r-para{font-size:12px;color:#444;line-height:1.6;}
  #tpl-sidebar .r-edu{margin-bottom:8px;}
  #tpl-sidebar .r-edu-deg{font-weight:600;font-size:12px;}
  #tpl-sidebar .r-edu-school{font-size:11px;color:#666;}

  /* MINIMAL */
  #tpl-minimal{padding:50px 50px;}
  #tpl-minimal .m-name{font-size:34px;font-weight:300;letter-spacing:-1px;color:#111;margin-bottom:4px;}
  #tpl-minimal .m-title{font-size:14px;color:#888;margin-bottom:6px;}
  #tpl-minimal .m-contact{font-size:12px;color:#aaa;margin-bottom:28px;}
  #tpl-minimal .m-section{font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:600;color:#111;margin:24px 0 10px;border-top:1px solid #eee;padding-top:10px;}
  #tpl-minimal .m-section:first-of-type{border-top:none;margin-top:0;}
  #tpl-minimal .m-para{font-size:13px;color:#555;line-height:1.7;}
  #tpl-minimal .m-job{margin-bottom:12px;}
  #tpl-minimal .m-job-title{font-weight:600;font-size:13px;color:#111;}
  #tpl-minimal .m-job-org{font-size:12px;color:#888;display:flex;justify-content:space-between;}
  #tpl-minimal .m-bullet{font-size:12px;color:#555;line-height:1.6;padding-left:14px;position:relative;}
  #tpl-minimal .m-bullet::before{content:'—';position:absolute;left:0;}
  #tpl-minimal .m-skills{display:flex;flex-wrap:wrap;gap:6px;}
  #tpl-minimal .m-skill-tag{padding:4px 12px;border:1px solid #ddd;border-radius:4px;font-size:12px;color:#555;}
  #tpl-minimal .m-edu-deg{font-weight:600;font-size:13px;}
  #tpl-minimal .m-edu-school{font-size:12px;color:#888;}

  /* ATS CLEAN */
  #tpl-ats{padding:36px 44px;font-family:'Roboto',sans-serif;}
  #tpl-ats .a-name{font-size:26px;font-weight:700;color:#111;margin-bottom:2px;}
  #tpl-ats .a-contact{font-size:12px;color:#333;margin-bottom:12px;}
  #tpl-ats .a-divider{border:none;border-top:2px solid #111;margin:8px 0;}
  #tpl-ats .a-section{font-size:13px;font-weight:700;color:#111;margin:12px 0 5px;text-transform:uppercase;letter-spacing:0.5px;}
  #tpl-ats .a-para{font-size:12px;color:#333;line-height:1.6;}
  #tpl-ats .a-job-title{font-weight:700;font-size:12px;color:#111;}
  #tpl-ats .a-job-org{font-size:12px;color:#333;display:flex;justify-content:space-between;}
  #tpl-ats .a-bullet{font-size:12px;color:#333;line-height:1.5;padding-left:14px;position:relative;margin-bottom:2px;}
  #tpl-ats .a-bullet::before{content:'•';position:absolute;left:2px;}
  #tpl-ats .a-skills{font-size:12px;color:#333;line-height:1.8;}
  #tpl-ats .a-edu-deg{font-weight:700;font-size:12px;color:#111;}
  #tpl-ats .a-edu-school{font-size:12px;color:#333;}

  /* TECH DARK */
  #tpl-tech{background:#0d1117;color:#c9d1d9;padding:36px 40px;font-family:'Source Code Pro',monospace;}
  #tpl-tech .t-name{font-size:28px;font-weight:600;color:#58a6ff;margin-bottom:2px;}
  #tpl-tech .t-role{font-size:13px;color:#3fb950;margin-bottom:8px;}
  #tpl-tech .t-contact{font-size:11px;color:#8b949e;margin-bottom:20px;}
  #tpl-tech .t-divider{border:none;border-top:1px solid #21262d;margin:12px 0;}
  #tpl-tech .t-section{font-size:11px;font-weight:600;color:#58a6ff;letter-spacing:2px;margin:14px 0 8px;}
  #tpl-tech .t-para{font-size:12px;color:#c9d1d9;line-height:1.7;}
  #tpl-tech .t-job-title{font-weight:600;font-size:13px;color:#f0f6fc;}
  #tpl-tech .t-job-org{font-size:11px;color:#8b949e;display:flex;justify-content:space-between;}
  #tpl-tech .t-bullet{font-size:11px;color:#c9d1d9;line-height:1.6;padding-left:16px;position:relative;margin-bottom:2px;}
  #tpl-tech .t-bullet::before{content:'>';position:absolute;left:0;color:#3fb950;}
  #tpl-tech .t-badges{display:flex;flex-wrap:wrap;gap:6px;}
  #tpl-tech .t-badge{padding:3px 10px;border:1px solid #30363d;border-radius:4px;font-size:11px;color:#58a6ff;background:#161b22;}
  #tpl-tech .t-edu-deg{font-weight:600;font-size:12px;color:#f0f6fc;}
  #tpl-tech .t-edu-school{font-size:11px;color:#8b949e;}

  /* Zoom indicator */
  .zoom-controls{
    position:fixed;bottom:24px;right:24px;display:flex;gap:8px;z-index:50;
  }
  .zoom-btn{
    width:36px;height:36px;border-radius:50%;background:#fff;border:1.5px solid #ddd;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);transition:all 0.2s;
  }
  .zoom-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* Saving toast */
  .toast{
    position:fixed;bottom:80px;right:24px;background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;
    transform:translateY(40px);opacity:0;transition:all 0.3s;pointer-events:none;
  }
  .toast.show{transform:translateY(0);opacity:1;}

  @media (max-width:768px){
    .editor-body{flex-direction:column;}
    .left-panel{width:100%;height:50vh;border-right:none;border-bottom:1px solid #e8e8e8;}
    .right-panel{height:50vh;}
    .resume-paper{transform:scale(0.55);transform-origin:top center;}
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="editor-top">
  <div class="editor-top-left">
    <a href="index.html" class="back-link">← Dashboard</a>
    <span class="editor-title">Resume Editor</span>
    <span class="tpl-badge" id="tplBadge">Template</span>
  </div>
  <div class="editor-actions">
    <span style="font-size:12px;color:var(--muted);margin-right:4px">Color:</span>
    <div class="color-group" id="colorGroup">
      <div class="color-dot active" style="background:#1a237e" data-color="#1a237e" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#263238" data-color="#263238" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#b8860b" data-color="#b8860b" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#880e4f" data-color="#880e4f" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#1b5e20" data-color="#1b5e20" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#4a0080" data-color="#4a0080" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#bf360c" data-color="#bf360c" onclick="setColor(this)"></div>
    </div>
    <button class="btn btn-ghost" onclick="saveResume()">💾 Save</button>
    <button class="btn btn-dl" onclick="downloadPDF()">⬇ Download PDF</button>
  </div>
</div>

<!-- BODY -->
<div class="editor-body">
  <!-- LEFT FORM -->
  <div class="left-panel" id="leftPanel">

    <!-- Personal Info -->
    <div class="form-section">
      <div class="section-header" onclick="toggleSection('personal')">
        <h3><span class="section-icon">👤</span> Personal Info</h3>
        <span class="chevron" id="chev-personal">▾</span>
      </div>
      <div class="section-body open" id="body-personal">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input class="form-input" id="f-name" placeholder="Alex Johnson" oninput="updatePreview()">
        </div>
        <div class="form-group">
          <label class="form-label">Job Title</label>
          <input class="form-input" id="f-title" placeholder="Software Engineer" oninput="updatePreview()">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input" id="f-email" placeholder="alex@email.com" oninput="updatePreview()">
          </div>
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input class="form-input" id="f-phone" placeholder="+91 9876543210" oninput="updatePreview()">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Address / Location</label>
          <input class="form-input" id="f-address" placeholder="Chennai, Tamil Nadu" oninput="updatePreview()">
        </div>
        <div class="form-group">
          <label class="form-label">LinkedIn URL</label>
          <input class="form-input" id="f-linkedin" placeholder="linkedin.com/in/alex" oninput="updatePreview()">
        </div>
        <div class="form-group">
          <label class="form-label">GitHub / Portfolio</label>
          <input class="form-input" id="f-github" placeholder="github.com/alex" oninput="updatePreview()">
        </div>
      </div>
    </div>

    <!-- Summary -->
    <div class="form-section">
      <div class="section-header" onclick="toggleSection('summary')">
        <h3><span class="section-icon">📝</span> Professional Summary</h3>
        <span class="chevron" id="chev-summary">▾</span>
      </div>
      <div class="section-body open" id="body-summary">
        <div class="form-group">
          <textarea class="form-textarea" id="f-summary" placeholder="Write 2-3 sentences about your professional background, key skills, and career goals…" oninput="updatePreview()" style="min-height:100px"></textarea>
        </div>
      </div>
    </div>

    <!-- Skills -->
    <div class="form-section">
      <div class="section-header" onclick="toggleSection('skills')">
        <h3><span class="section-icon">⚡</span> Skills</h3>
        <span class="chevron" id="chev-skills">▾</span>
      </div>
      <div class="section-body open" id="body-skills">
        <div class="skills-wrap" id="skillsWrap"></div>
        <div class="form-row">
          <input class="form-input" id="skillInput" placeholder="Type a skill…" onkeydown="addSkillOnEnter(event)">
          <button class="btn btn-ghost" onclick="addSkill()">+ Add</button>
        </div>
        <p style="font-size:11px;color:var(--muted);margin-top:6px">Press Enter or click Add after each skill</p>
      </div>
    </div>

    <!-- Experience -->
    <div class="form-section">
      <div class="section-header" onclick="toggleSection('experience')">
        <h3><span class="section-icon">💼</span> Experience</h3>
        <span class="chevron" id="chev-experience">▾</span>
      </div>
      <div class="section-body open" id="body-experience">
        <div id="expList"></div>
        <button class="add-btn" onclick="addExperience()">+ Add Experience</button>
      </div>
    </div>

    <!-- Education -->
    <div class="form-section">
      <div class="section-header" onclick="toggleSection('education')">
        <h3><span class="section-icon">🎓</span> Education</h3>
        <span class="chevron" id="chev-education">▾</span>
      </div>
      <div class="section-body open" id="body-education">
        <div id="eduList"></div>
        <button class="add-btn" onclick="addEducation()">+ Add Education</button>
      </div>
    </div>

    <!-- Projects -->
    <div class="form-section">
      <div class="section-header" onclick="toggleSection('projects')">
        <h3><span class="section-icon">🚀</span> Projects</h3>
        <span class="chevron" id="chev-projects">▾</span>
      </div>
      <div class="section-body open" id="body-projects">
        <div id="projList"></div>
        <button class="add-btn" onclick="addProject()">+ Add Project</button>
      </div>
    </div>

    <div style="height:40px"></div>
  </div>

  <!-- RIGHT PREVIEW -->
  <div class="right-panel">
    <div class="resume-paper" id="resumePaper">
      <!-- Template injected by JS -->
    </div>
  </div>
</div>

<!-- Zoom controls -->
<div class="zoom-controls">
  <div class="zoom-btn" onclick="zoom(-0.1)">−</div>
  <div class="zoom-btn" onclick="zoom(0.1)">+</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===================== STATE =====================
let resumeData = {
  name:'',title:'',email:'',phone:'',address:'',linkedin:'',github:'',
  summary:'',skills:[],experience:[],education:[],projects:[]
};
let themeColor = '#1a237e';
let currentTemplate = 'tpl1';
let scale = 0.85;

// Load from localStorage
const rid = localStorage.getItem('currentResumeId');
const tplInfo = JSON.parse(localStorage.getItem('currentTemplate')||'{"id":"tpl1","name":"Classic Blue","category":"Professional"}');
currentTemplate = tplInfo.id;

document.getElementById('tplBadge').textContent = tplInfo.name;

// Load saved resume data if editing
const resumes = JSON.parse(localStorage.getItem('resumes')||'[]');
const savedResume = rid ? resumes.find(r=>r.id===rid) : null;
if(savedResume && savedResume.content) {
  resumeData = {...resumeData, ...savedResume.content};
  themeColor = savedResume.themeColor || themeColor;
  populateForm();
}

// ===================== FORM POPULATION =====================
function populateForm() {
  document.getElementById('f-name').value = resumeData.name||'';
  document.getElementById('f-title').value = resumeData.title||'';
  document.getElementById('f-email').value = resumeData.email||'';
  document.getElementById('f-phone').value = resumeData.phone||'';
  document.getElementById('f-address').value = resumeData.address||'';
  document.getElementById('f-linkedin').value = resumeData.linkedin||'';
  document.getElementById('f-github').value = resumeData.github||'';
  document.getElementById('f-summary').value = resumeData.summary||'';
  renderSkillChips();
  renderExperienceList();
  renderEducationList();
  renderProjectList();
}

// ===================== SECTION TOGGLE =====================
function toggleSection(id) {
  const body = document.getElementById('body-'+id);
  const chev = document.getElementById('chev-'+id);
  body.classList.toggle('open');
  chev.textContent = body.classList.contains('open') ? '▾' : '▸';
}

// ===================== SKILLS =====================
function renderSkillChips() {
  const wrap = document.getElementById('skillsWrap');
  wrap.innerHTML = resumeData.skills.map((s,i)=>
    `<span class="skill-chip">${s}<span class="chip-remove" onclick="removeSkill(${i})">×</span></span>`
  ).join('');
}
function addSkill() {
  const inp = document.getElementById('skillInput');
  const val = inp.value.trim();
  if(!val) return;
  if(!resumeData.skills.includes(val)) resumeData.skills.push(val);
  inp.value='';
  renderSkillChips();
  updatePreview();
}
function addSkillOnEnter(e) { if(e.key==='Enter'){e.preventDefault();addSkill();} }
function removeSkill(i) { resumeData.skills.splice(i,1); renderSkillChips(); updatePreview(); }

// ===================== EXPERIENCE =====================
let expCount = 0;
function addExperience(data={}) {
  const id = ++expCount;
  const idx = resumeData.experience.length;
  resumeData.experience.push(data);
  const div = document.createElement('div');
  div.className = 'entry-card';
  div.id = 'exp-'+id;
  div.innerHTML = `
    <button class="entry-remove" onclick="removeEntry('exp',${id},${idx})">✕</button>
    <div class="form-group"><label class="form-label">Job Title</label>
    <input class="form-input" value="${data.title||''}" placeholder="Software Engineer" oninput="updateExp(${idx},'title',this.value)"></div>
    <div class="form-group"><label class="form-label">Company</label>
    <input class="form-input" value="${data.company||''}" placeholder="Google" oninput="updateExp(${idx},'company',this.value)"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Start</label>
      <input class="form-input" value="${data.start||''}" placeholder="Jan 2022" oninput="updateExp(${idx},'start',this.value)"></div>
      <div class="form-group"><label class="form-label">End</label>
      <input class="form-input" value="${data.end||''}" placeholder="Present" oninput="updateExp(${idx},'end',this.value)"></div>
    </div>
    <div class="form-group"><label class="form-label">Description / Achievements</label>
    <textarea class="form-textarea" placeholder="• Built REST APIs reducing latency by 40%…" oninput="updateExp(${idx},'desc',this.value)">${data.desc||''}</textarea></div>
  `;
  document.getElementById('expList').appendChild(div);
}
function updateExp(idx,key,val){if(resumeData.experience[idx])resumeData.experience[idx][key]=val;updatePreview();}
function removeEntry(type,domId,idx){
  document.getElementById(type+'-'+domId).remove();
  if(type==='exp')resumeData.experience.splice(idx,1);
  else if(type==='edu')resumeData.education.splice(idx,1);
  else resumeData.projects.splice(idx,1);
  updatePreview();
}
function renderExperienceList(){resumeData.experience.forEach(e=>addExperience(e));}

// ===================== READ FORM =====================
function readForm() {
  resumeData.name = document.getElementById('f-name').value;
  resumeData.title = document.getElementById('f-title').value;
  resumeData.email = document.getElementById('f-email').value;
  resumeData.phone = document.getElementById('f-phone').value;
  resumeData.address = document.getElementById('f-address').value;
  resumeData.linkedin = document.getElementById('f-linkedin').value;
  resumeData.github = document.getElementById('f-github').value;
  resumeData.summary = document.getElementById('f-summary').value;
}

// ===================== COLOR =====================
function setColor(el) {
  themeColor = el.getAttribute('data-color');
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
  el.classList.add('active');
  updatePreview();
}

// ===================== ZOOM =====================
function zoom(d) {
  scale = Math.max(0.4, Math.min(1.2, scale+d));
  document.getElementById('resumePaper').style.transform = `scale(${scale})`;
  document.getElementById('resumePaper').style.transformOrigin = 'top left';
}

// ===================== UPDATE PREVIEW =====================
function updatePreview() {
  readForm();
  const paper = document.getElementById('resumePaper');
  paper.innerHTML = renderTemplate(currentTemplate, resumeData, themeColor);
}

function safe(str) { return str ? String(str).replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

function renderTemplate(tpl, d, color) {
  if(tpl==='tpl1') return renderClassic(d,color);
  if(tpl==='tpl2') return renderSidebar(d,color);
  if(tpl==='tpl3') return renderMinimal(d,color);
  if(tpl==='tpl4') return renderCreative(d,color);
  if(tpl==='tpl5') return renderExecutive(d,color);
  if(tpl==='tpl6') return renderATS(d,color);
  if(tpl==='tpl7') return renderTech(d,color);
  if(tpl==='tpl8') return renderElegant(d,color);
  if(tpl==='tpl9') return renderBold(d,color);
  if(tpl==='tpl10') return renderInfo(d,color);
  if(tpl==='tpl11') return renderPastel(d,color);
  if(tpl==='tpl12') return renderNature(d,color);
  return renderClassic(d,color);
}

function expHTML_classic(exp, color) {
  return exp.map(e=>`
    <div style="margin-bottom:12px">
      <div style="font-weight:600;font-size:13px">${safe(e.title)}</div>
      <div style="font-size:12px;color:#555;display:flex;justify-content:space-between">
        <span>${safe(e.company)}</span><span style="color:#888">${safe(e.start)}${e.end?' – '+safe(e.end):''}</span>
      </div>
      ${e.desc?`<div style="font-size:12px;color:#444;margin-top:4px;line-height:1.6">${safe(e.desc).split('\n').map(l=>`<div style="padding-left:12px;position:relative"><span style="position:absolute;left:0">•</span>${l}</div>`).join('')}</div>`:''}
    </div>`).join('');
}
function eduHTML(edu) {
  return edu.map(e=>`
    <div style="margin-bottom:8px">
      <div style="font-weight:600;font-size:13px">${safe(e.degree)}</div>
      <div style="font-size:12px;color:#666;display:flex;justify-content:space-between">
        <span>${safe(e.school)}</span><span>${safe(e.year)}</span>
      </div>
      ${e.gpa?`<div style="font-size:11px;color:#888">GPA: ${safe(e.gpa)}</div>`:''}
    </div>`).join('');
}
function projHTML(proj) {
  return proj.map(p=>`
    <div style="margin-bottom:10px">
      <div style="font-weight:600;font-size:13px">${safe(p.name)}</div>
      ${p.tech?`<div style="font-size:11px;color:#888;margin-bottom:3px">${safe(p.tech)}</div>`:''}
      ${p.desc?`<div style="font-size:12px;color:#444;line-height:1.5">${safe(p.desc)}</div>`:''}
    </div>`).join('');
}

  return `<div id="tpl-classic" style="font-family:'DM Sans',sans-serif;min-height:1123px">
    <div class="c-header" style="background:${c}">
      <div class="c-name">${safe(d.name)||'Your Name'}</div>

// ===================== SAVE =====================
function saveResume() {
  readForm();
  const resumes = JSON.parse(localStorage.getItem('resumes')||'[]');
  const idx = resumes.findIndex(r=>r.id===rid);
  const data = {
    id:rid, templateId:currentTemplate, templateName:tplInfo.name, category:tplInfo.category,
    name:resumeData.name||'Untitled Resume', updated:new Date().toISOString(),
    themeColor:themeColor, content:resumeData
  };
  if(idx>=0) resumes[idx]=data; else resumes.push(data);
  localStorage.setItem('resumes', JSON.stringify(resumes));
  showToast('✓ Resume saved!');
  // API call
  fetch(`http://localhost:8000/resumes/${rid}`, {
    method:'PUT',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('token')},
    body:JSON.stringify({content_json:resumeData,theme_color:themeColor})
  }).catch(()=>{});
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ===================== DOWNLOAD PDF =====================
function downloadPDF() {
  saveResume();
  showToast('⏳ Generating PDF…');
  // Attempt backend download; fallback to print
  const token = localStorage.getItem('token');
  if(token) {
    fetch(`http://localhost:8000/resumes/${rid}/download`, {
      headers:{'Authorization':'Bearer '+token}
    }).then(r=>{
      if(r.ok) return r.blob();
      throw new Error('Backend unavailable');
    }).then(blob=>{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url; a.download=(resumeData.name||'resume')+'.pdf'; a.click();
    }).catch(()=>printFallback());
  } else { printFallback(); }
}
function printFallback() {
  const w = window.open('','_blank');
  const paper = document.getElementById('resumePaper').innerHTML;
  w.document.write(`<!DOCTYPE html><html><head><title>${resumeData.name||'Resume'}</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=Roboto:wght@300;400;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif}#tpl-ats{font-family:'Roboto',sans-serif}#tpl-tech{background:#0d1117;color:#c9d1d9;font-family:'Source Code Pro',monospace}.a-divider{border:none;border-top:2px solid #111}.a-bullet::before{content:'•';position:absolute;left:2px}.a-bullet{position:relative;padding-left:14px}.t-bullet::before{content:'>';position:absolute;left:0;color:#3fb950}.t-bullet{position:relative;padding-left:16px}@media print{@page{size:A4;margin:0}}</style>
  </head><body>${paper}</body></html>`);
  w.document.close();
  setTimeout(()=>w.print(),800);
}

// Initial render
updatePreview();

// Auto-save
let autoSaveTimer;
document.addEventListener('input', ()=>{
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(saveResume, 3000);
});
</script>
</body>
</html>
